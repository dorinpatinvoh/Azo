databases:
  - name: azo-db
    databaseName: azo
    user: azo
    plan: free

services:
  - type: web
    name: azo-backend
    runtime: node
    plan: free
    rootDir: azo-backend
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: azo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        value: "+2290197000000"
      - key: SMS_PROVIDER
        value: "simulation"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
